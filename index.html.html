<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content= "width=device-width, initial-scale=1.0"> 
        <style>
            html {
                background-color:antiquewhite;
            }
        </style>
    </head>
    <body>
        <h1 id="currentHometown">Your previous Hometown is: Ninh Dinh</h1>
        <label>Enter your current Hometown:</label>
        <input id="myText">
        <button id="myUpdate">Update</button>
        <script>
            let username;
            document.getElementById("myUpdate").onclick = function() {
                username = document.getElementById("myText").value;
                document.getElementById("currentHometown").textContent = `Your current Hometown is: ${username}`
            }
        </script>
    </body>
    </html>
