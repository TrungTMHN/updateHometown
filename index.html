<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content= "width=device-width, initial-scale=1.0"> 
        <style>
            html {
                background-color:#a18cd1;
            }
            div {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            h1 {
                font-size: 30px;
            }
            h1, label, input, button {
                font-family: "Helvetica", "Arial", sans-serif;
            }
            label, input, button {
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <div>
            <h1 id="currentHometown">Your previous Hometown is: Nam Dinh</h1>
        </div>
        <div>
            <label>Enter your current Hometown:</label>
            <input id="myText">
            <button id="myUpdate">Update</button>
            <script>
                let username;
                document.getElementById("myUpdate").onclick = function() {
                username = document.getElementById("myText").value;
                document.getElementById("currentHometown").textContent = `Your current Hometown is: ${username}`
                }
            </script>
        </div>
    </body>
    </html>
